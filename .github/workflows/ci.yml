name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  content-studio:
    name: Content Studio (question shard validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: content-studio/package-lock.json
      - run: npm ci
        working-directory: content-studio
      # Validates every question shard: required fields, CEFR/type rules,
      # sectionId scoping, duplicate ids and image references.
      - run: npm test
        working-directory: content-studio

  rust:
    name: Rust (cargo test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux system deps (Tauri runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      # tauri::generate_context!() (src/lib.rs) needs ../dist to exist at
      # compile time. Build the frontend in this job (parallel to the Vitest
      # job above) so cargo can resolve the macro.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # src-tauri/src/modules/{vocabulary,path_content}.rs `include_str!` files
      # under content-studio/data/ at compile time. Those JSON files are tracked
      # in git, so a plain checkout is enough — no fixture step needed.
      - name: cargo fmt (check)
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --message-format=short 2>&1 | tee clippy.log
      - name: Upload clippy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-log
          path: src-tauri/clippy.log
          if-no-files-found: ignore
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
